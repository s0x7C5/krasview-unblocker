<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #16181d; --panel: #2c313b; --text: #e6e8ec;
  --muted: #8b93a3; --accent: #43a047; --danger: #e5534b;
}
* { box-sizing: border-box; }
body {
  width: 260px; margin: 0; padding: 14px;
  background: var(--bg); color: var(--text);
  font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
}
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.name { font-weight: 600; }
.state { font-size: 12px; color: var(--muted); }
.state.on { color: var(--accent); }

/* переключатель */
.sw { position: relative; flex: none; width: 40px; height: 22px; }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw span {
  position: absolute; inset: 0; border-radius: 22px;
  background: var(--panel); cursor: pointer; transition: background .15s;
}
.sw span::before {
  content: ''; position: absolute; left: 3px; top: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #e6e8ec; transition: transform .15s;
}
.sw input:checked + span { background: var(--accent); }
.sw input:checked + span::before { transform: translateX(18px); }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.warn {
  margin: 12px 0 0; color: var(--danger); font-size: 11.5px; line-height: 1.4;
}
.warn:empty { display: none; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="name">Починка видео</div>
      <div id="state" class="state"></div>
    </div>
    <label class="sw">
      <input id="enabled" type="checkbox">
      <span></span>
    </label>
  </div>

  <p id="warn" class="warn"></p>

  <script src="popup.js"></script>
</body>
</html>
